name: Daily Docker Image Build

on:
  schedule:
    # Run daily at 3 AM PST (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform slug
        id: platform
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # Toolchains and cloud CLIs are refreshed weekly rather than daily, so
      # six nights out of seven the build reuses those cached layers and only
      # the AI CLI layers are rebuilt and pushed.
      - name: Compute weekly toolchain refresh key
        id: refresh
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TOOLCHAIN_REFRESH=${{ steps.refresh.outputs.week }}
            AI_CACHEBUST=${{ github.run_id }}
          # Registry-backed cache: the GitHub Actions cache is capped at 10 GB
          # per repo, which these images blow past across six mode=max scopes.
          # Lives in its own package so the cleanup job below can't evict it.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-buildcache:full-${{ steps.platform.outputs.slug }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-buildcache:full-${{ steps.platform.outputs.slug }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The daily tags are gated on is_default_branch, so a workflow_dispatch on
    # a feature branch produces only the branch-name tag. Publish whichever tag
    # was actually created so test-image can find the image it just built.
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=daily-{{date 'YYYY-MM-DD'}},enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  test-image:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test image functionality
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }}"
          echo "Testing daily build image: $IMAGE"

          docker run --rm "$IMAGE" /bin/bash -c '
            echo "Testing installations..."
            fail=0

            # Every tool must resolve on PATH and actually execute. The version
            # calls matter as much as the lookups: several of these are trimmed
            # in the Dockerfile and a bad trim only shows up at runtime.
            for tool in claude codex gh docker brew aws gcloud go rustc cargo uv prek man; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "✅ $tool -> $(command -v "$tool")"
              else
                echo "❌ $tool missing"
                fail=1
              fi
            done

            claude --version || fail=1
            codex --version  || fail=1
            gh --version     || fail=1
            docker --version || fail=1
            docker buildx version  || fail=1
            docker compose version || fail=1
            # First brew call bootstraps Homebrew via the shim; bottles only
            # work at the exact default prefix, so assert the shim produced it.
            brew --version   || fail=1
            [ "$(brew --prefix)" = "/home/linuxbrew/.linuxbrew" ] || { echo "❌ brew prefix wrong"; fail=1; }
            aws --version    || fail=1
            gcloud --version || fail=1
            go version       || fail=1
            rustc --version  || fail=1
            cargo --version  || fail=1
            uv --version     || fail=1

            # Confirms the dpkg path-include + man-db diversion removal still work
            man byobu >/dev/null 2>&1 || { echo "❌ man byobu failed"; fail=1; }

            [ "$fail" = 0 ] && echo "All core tools are properly installed!"
            exit $fail
          '

      - name: Test headless Chromium
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }}"
          # Chromium's system libraries are baked into the image (#31). Fetch a
          # real browser build the way Playwright would and prove it links and
          # renders, rather than trusting the package list: a missing library
          # only surfaces at launch. playwright-core@latest is deliberate -- if
          # a new Playwright starts needing a library the image lacks, this is
          # where that should show up.
          docker run --rm "$IMAGE" /bin/bash -c '
            cd "$(mktemp -d)" || exit 1
            npx --yes playwright-core@latest install chromium || exit 1
            fail=0
            # The image carries the full Playwright dependency table, so its own
            # check must come back clean (it reads dpkg status, no apt lists needed).
            npx --yes playwright-core@latest install-deps --dry-run chromium \
              || { echo "❌ playwright install-deps reports missing packages"; fail=1; }
            # Directory layout differs per arch (chrome-linux64/chrome and
            # chrome-headless-shell-linux64/chrome-headless-shell on amd64,
            # chrome-linux/{chrome,headless_shell} on arm64), so locate by name.
            bins=$(find ~/.cache/ms-playwright -type f \
                     \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \))
            [ "$(echo "$bins" | grep -c .)" -ge 2 ] \
              || { echo "❌ expected chrome and headless shell binaries, found: $bins"; fail=1; }
            for bin in $bins; do
              missing=$(ldd "$bin" | grep "not found" || true)
              if [ -n "$missing" ]; then
                echo "❌ $bin is missing system libraries:"; echo "$missing"; fail=1
              else
                echo "✅ $bin links cleanly"
              fi
            done
            npx --yes playwright-core@latest screenshot --browser chromium \
              "data:text/html;charset=utf-8,<h1>headless ok</h1>" shot.png || fail=1
            file shot.png | grep -q "PNG image" || { echo "❌ headless screenshot failed"; fail=1; }
            [ "$fail" = 0 ] && echo "Headless Chromium works!"
            exit $fail
          '

      - name: Test runtime UID/GID remap
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.merge.outputs.version }}"
          docker run --rm -e HOST_UID=4242 -e HOST_GID=4243 "$IMAGE" /bin/bash -c '
            set -e
            echo "Inside container: uid=$(id -u) gid=$(id -g)"
            [ "$(id -u)" = "4242" ] || { echo "FAIL: UID mismatch (got $(id -u), want 4242)"; exit 1; }
            [ "$(id -g)" = "4243" ] || { echo "FAIL: GID mismatch (got $(id -g), want 4243)"; exit 1; }
            touch /home/vscode/probe
            probe_owner=$(stat -c %u:%g /home/vscode/probe)
            [ "$probe_owner" = "4242:4243" ] || { echo "FAIL: probe owner $probe_owner != 4242:4243"; exit 1; }
            zshrc_owner=$(stat -c %u:%g /home/vscode/.zshrc)
            [ "$zshrc_owner" = "4242:4243" ] || { echo "FAIL: .zshrc owner $zshrc_owner != 4242:4243"; exit 1; }
            echo "Remap OK"
          '

  cleanup-old-images:
    needs: [merge, test-image]
    runs-on: ubuntu-latest
    # Deleting published versions is irreversible; never do it from a
    # workflow_dispatch on a feature branch.
    if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      packages: write

    steps:
      - name: Delete old daily images
        uses: actions/delete-package-versions@v5
        with:
          package-name: devcontainer
          package-type: container
          min-versions-to-keep: 7
          delete-only-untagged-versions: false
