name: Docker PR Build

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-test-full:
    # An explicit name: is required. Without it GitHub appends the matrix
    # combination to the check name, and the main-protection ruleset requires
    # the bare context 'build-and-test-full' -- which would then never report,
    # blocking every PR. The suffix keeps amd64 reporting under the existing
    # required name and adds arm64 as a separate, additive check.
    name: build-and-test-full${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: ''
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: '-arm64'
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check for relevant changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'
              - 'scripts/entrypoint.sh'
              - 'scripts/brew-shim.sh'
              - '.github/workflows/daily-docker-build.yml'
              - '.github/workflows/docker-pr-build.yml'

      - name: Checkout repository
        if: steps.changes.outputs.dockerfile == 'true'
        uses: actions/checkout@v7

      - name: Test entrypoint gating logic
        if: steps.changes.outputs.dockerfile == 'true'
        run: bash scripts/test_entrypoint.sh

      - name: Set up Docker Buildx
        if: steps.changes.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: steps.changes.outputs.dockerfile == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: devcontainer:pr-test
          cache-from: type=gha,scope=pr-${{ matrix.platform }}
          cache-to: type=gha,scope=pr-${{ matrix.platform }},mode=max

      - name: Test image functionality
        if: steps.changes.outputs.dockerfile == 'true'
        run: |
          docker run --rm devcontainer:pr-test /bin/bash -c '
            echo "Testing installations..."
            fail=0

            # Every tool must resolve on PATH and actually execute. The version
            # calls matter as much as the lookups: several of these are trimmed
            # in the Dockerfile and a bad trim only shows up at runtime.
            for tool in claude codex gh docker brew aws gcloud go rustc cargo uv prek man; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "✅ $tool -> $(command -v "$tool")"
              else
                echo "❌ $tool missing"
                fail=1
              fi
            done

            claude --version || fail=1
            codex --version  || fail=1
            gh --version     || fail=1
            docker --version || fail=1
            docker buildx version  || fail=1
            docker compose version || fail=1
            # First brew call bootstraps Homebrew via the shim; bottles only
            # work at the exact default prefix, so assert the shim produced it.
            brew --version   || fail=1
            [ "$(brew --prefix)" = "/home/linuxbrew/.linuxbrew" ] || { echo "❌ brew prefix wrong"; fail=1; }
            aws --version    || fail=1
            gcloud --version || fail=1
            go version       || fail=1
            rustc --version  || fail=1
            cargo --version  || fail=1
            uv --version     || fail=1

            # Confirms the dpkg path-include + man-db diversion removal still work
            man byobu >/dev/null 2>&1 || { echo "❌ man byobu failed"; fail=1; }

            [ "$fail" = 0 ] && echo "All core tools are properly installed!"
            exit $fail
          '

      - name: Test headless Chromium
        if: steps.changes.outputs.dockerfile == 'true'
        run: |
          # Chromium's system libraries are baked into the image (#31). Fetch a
          # real browser build the way Playwright would and prove it links and
          # renders, rather than trusting the package list: a missing library
          # only surfaces at launch. playwright-core@latest is deliberate -- if
          # a new Playwright starts needing a library the image lacks, this is
          # where that should show up.
          docker run --rm devcontainer:pr-test /bin/bash -c '
            cd "$(mktemp -d)" || exit 1
            npx --yes playwright-core@latest install chromium || exit 1
            fail=0
            # The image carries the full Playwright dependency table, so its own
            # check must come back clean (it reads dpkg status, no apt lists needed).
            npx --yes playwright-core@latest install-deps --dry-run chromium \
              || { echo "❌ playwright install-deps reports missing packages"; fail=1; }
            # Directory layout differs per arch (chrome-linux64/chrome and
            # chrome-headless-shell-linux64/chrome-headless-shell on amd64,
            # chrome-linux/{chrome,headless_shell} on arm64), so locate by name.
            bins=$(find ~/.cache/ms-playwright -type f \
                     \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \))
            [ "$(echo "$bins" | grep -c .)" -ge 2 ] \
              || { echo "❌ expected chrome and headless shell binaries, found: $bins"; fail=1; }
            for bin in $bins; do
              missing=$(ldd "$bin" | grep "not found" || true)
              if [ -n "$missing" ]; then
                echo "❌ $bin is missing system libraries:"; echo "$missing"; fail=1
              else
                echo "✅ $bin links cleanly"
              fi
            done
            npx --yes playwright-core@latest screenshot --browser chromium \
              "data:text/html;charset=utf-8,<h1>headless ok</h1>" shot.png || fail=1
            file shot.png | grep -q "PNG image" || { echo "❌ headless screenshot failed"; fail=1; }
            [ "$fail" = 0 ] && echo "Headless Chromium works!"
            exit $fail
          '

      - name: Test runtime UID/GID remap
        if: steps.changes.outputs.dockerfile == 'true'
        run: |
          docker run --rm -e HOST_UID=4242 -e HOST_GID=4243 devcontainer:pr-test /bin/bash -c '
            set -e
            echo "Inside container: uid=$(id -u) gid=$(id -g)"
            [ "$(id -u)" = "4242" ] || { echo "FAIL: UID mismatch (got $(id -u), want 4242)"; exit 1; }
            [ "$(id -g)" = "4243" ] || { echo "FAIL: GID mismatch (got $(id -g), want 4243)"; exit 1; }
            touch /home/vscode/probe
            probe_owner=$(stat -c %u:%g /home/vscode/probe)
            [ "$probe_owner" = "4242:4243" ] || { echo "FAIL: probe owner $probe_owner != 4242:4243"; exit 1; }
            zshrc_owner=$(stat -c %u:%g /home/vscode/.zshrc)
            [ "$zshrc_owner" = "4242:4243" ] || { echo "FAIL: .zshrc owner $zshrc_owner != 4242:4243"; exit 1; }
            echo "Remap OK"
          '
